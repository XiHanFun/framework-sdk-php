name: CI

# PHP SDK 的门禁：格式检查（PSR-12）、静态检查（PHPStan 最高级别）与全部测试（含读取规范一致性向量的测试）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 构建与测试（PHP ${{ matrix.php }}，${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.3', '8.4']
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出（含规范 submodule）
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: 安装 PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          tools: composer:v2
          coverage: none

      - name: 安装依赖
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: 格式检查
        run: composer lint

      - name: 静态检查
        run: composer analyse

      - name: 测试
        run: composer test
